name: 部署「数据结构 · 排序 MV」网页实时版到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'projects/sorting-mv/src/**'
      - 'projects/sorting-mv/web/**'
      - 'projects/sorting-mv/web-public/**'
      - 'projects/sorting-mv/index.html'
      - 'projects/sorting-mv/vite.config.mts'
      - 'projects/sorting-mv/package.json'
      - 'projects/sorting-mv/package-lock.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/sorting-mv
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/sorting-mv/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 校验 9 个排序算法的快照（合法排列 + 最终升序）
        run: npm run check:sorts

      - name: 类型检查
        run: npm run typecheck

      - name: 构建网页实时版
        run: npm run web:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: projects/sorting-mv/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5